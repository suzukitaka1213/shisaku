<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1.0"/>
<title>セミナー総合案内ポータル</title>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
<link href="https://fonts.googleapis.com/css2?family=M+PLUS+Rounded+1c:wght@500;700;800;900&family=Noto+Sans+JP:wght@400;500;700&display=swap" rel="stylesheet"/>
<style>
:root {
  --bg: #fdfbf7;
  --card-bg: #ffffff;
  --border: #f0eada;
  --text: #4a403a;
  --text-muted: #8c827a;
  --mint: #36b37e;
  --mint-soft: #e3fcef;
  --peach: #ff7452;
  --peach-soft: #ffebe6;
  --yellow: #ffab00;
  --yellow-soft: #fffae6;
  --shadow: 0 4px 16px rgba(140, 130, 122, 0.08);
  --shadow-hover: 0 8px 24px rgba(140, 130, 122, 0.15);
  --radius: 18px;
}
* { box-sizing: border-box; margin: 0; padding: 0; }
body {
  font-family: 'M PLUS Rounded 1c', 'Noto Sans JP', sans-serif;
  background-color: var(--bg);
  color: var(--text);
  padding: 24px 16px;
  min-height: 100vh;
}
.container { max-width: 1100px; margin: 0 auto; display: flex; flex-direction: column; gap: 20px; }

/* HEADER HERO */
.hero {
  background: linear-gradient(135deg, #fff3e0 0%, #e8f5e9 100%);
  border: 2px solid var(--border); border-radius: var(--radius);
  padding: 24px; display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 16px;
  box-shadow: var(--shadow);
}
.hero-title { font-size: 22px; font-weight: 900; color: #3d352e; }
.hero-title span { font-size: 12px; display: block; color: var(--peach); font-weight: 800; letter-spacing: 1px; }

.hero-actions { display: flex; align-items: center; gap: 12px; }
.stat-pills { display: flex; gap: 8px; }
.pill-card {
  background: #ffffff; border: 2px solid var(--border); border-radius: 14px;
  padding: 6px 14px; text-align: center;
}
.pill-card .num { font-size: 20px; font-weight: 900; color: var(--mint); line-height: 1; }
.pill-card .lbl { font-size: 10px; color: var(--text-muted); font-weight: 700; }

.btn-add-seminar {
  background: var(--peach); color: #fff; border: none; border-radius: 14px;
  padding: 12px 20px; font-size: 13px; font-weight: 900; cursor: pointer;
  box-shadow: 0 4px 12px rgba(255, 116, 82, 0.3); transition: all 0.2s;
  display: flex; align-items: center; gap: 6px;
}
.btn-add-seminar:hover { background: #e05d3d; transform: translateY(-2px); }

/* SEARCH & TABS */
.control-panel {
  background: var(--card-bg); border: 2px solid var(--border); border-radius: var(--radius);
  padding: 14px 18px; display: flex; gap: 12px; flex-wrap: wrap; align-items: center; justify-content: space-between;
  box-shadow: var(--shadow);
}
.search-input {
  flex: 1; min-width: 240px; padding: 10px 16px; border: 2px solid var(--border);
  border-radius: 12px; outline: none; font-size: 14px; background: #fff8f0; font-family: inherit; color: var(--text);
}
.search-input:focus { border-color: var(--peach); background: #fff; }

.tab-group { display: flex; gap: 6px; align-items: center; }
.tab-btn {
  padding: 8px 14px; border-radius: 12px; border: 2px solid var(--border);
  background: #fff; font-size: 12px; font-weight: 800; cursor: pointer; color: var(--text-muted); transition: all 0.2s;
}
.tab-btn.active, .tab-btn:hover { background: var(--peach-soft); color: var(--peach); border-color: var(--peach); }

/* GRID & CARDS */
.grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(330px, 1fr)); gap: 18px; }
.card {
  background: var(--card-bg); border: 2px solid var(--border); border-radius: var(--radius);
  padding: 20px; box-shadow: var(--shadow); display: flex; flex-direction: column; gap: 12px;
  transition: transform 0.2s, box-shadow 0.2s; position: relative;
}
.card:hover { transform: translateY(-4px); box-shadow: var(--shadow-hover); }

.card-hdr { display: flex; justify-content: space-between; align-items: flex-start; gap: 8px; }
.card-title { font-size: 17px; font-weight: 900; line-height: 1.3; color: #2d251e; }

.badge { padding: 4px 10px; border-radius: 20px; font-size: 11px; font-weight: 800; white-space: nowrap; }
.badge-active { background: var(--mint-soft); color: var(--mint); }
.badge-prep { background: var(--yellow-soft); color: #b78103; }
.badge-plan { background: #f0f0f0; color: #777; }

.info-table { background: #faf8f5; border-radius: 12px; padding: 10px 12px; display: grid; grid-template-columns: 1fr 1fr; gap: 8px; font-size: 12px; }
.info-item span { color: var(--text-muted); font-size: 10px; display: block; font-weight: 700; }
.info-item strong { font-size: 12px; color: var(--text); }

.ideal-box {
  background: #fff3e0; border-left: 4px solid var(--peach);
  border-radius: 0 10px 10px 0; padding: 10px; font-size: 12px; color: #5c3810; line-height: 1.4;
}
.ideal-box strong { color: var(--peach); display: block; margin-bottom: 2px; font-size: 11px; }

.card-ftr { margin-top: auto; padding-top: 10px; display: flex; gap: 8px; align-items: center; justify-content: space-between; border-top: 1px dashed var(--border); }
.btn-group-left { display: flex; gap: 8px; align-items: center; }

.btn-sec { font-size: 12px; font-weight: 800; color: var(--text-muted); cursor: pointer; background: none; border: none; padding: 4px; }
.btn-sec:hover { color: var(--peach); }

.btn-reserve {
  background: var(--mint-soft); color: var(--mint); border: 1.5px solid var(--mint);
  border-radius: 10px; padding: 6px 12px; font-size: 12px; font-weight: 800; cursor: pointer; transition: all 0.2s;
}
.btn-reserve:hover { background: var(--mint); color: #fff; }

.btn-primary {
  background: var(--peach); color: #fff; border: none; border-radius: 10px;
  padding: 7px 14px; font-size: 12px; font-weight: 800; text-decoration: none;
  box-shadow: 0 3px 8px rgba(255, 116, 82, 0.25); transition: all 0.2s;
}
.btn-primary:hover { background: #e05d3d; }

/* MODALS */
.modal-bg { position: fixed; inset: 0; background: rgba(74, 64, 58, 0.35); backdrop-filter: blur(4px); z-index: 999; display: none; align-items: center; justify-content: center; padding: 16px; }
.modal-bg.open { display: flex; }
.modal { background: #fff; border: 2px solid var(--border); border-radius: 24px; width: min(540px, 100%); max-height: 88vh; overflow-y: auto; padding: 24px; display: flex; flex-direction: column; gap: 16px; box-shadow: 0 16px 40px rgba(0,0,0,0.15); }

.modal-hdr { display: flex; justify-content: space-between; align-items: center; border-bottom: 2px solid var(--border); padding-bottom: 12px; }
.modal-hdr h2 { font-size: 18px; font-weight: 900; color: #2d251e; }
.modal-close { cursor: pointer; font-size: 20px; font-weight: 900; color: var(--text-muted); }

.form-grid { display: flex; flex-direction: column; gap: 12px; font-size: 13px; }
.form-group { display: flex; flex-direction: column; gap: 4px; }
.form-group label { font-size: 11px; font-weight: 800; color: var(--text-muted); }
.form-group input, .form-group select, .form-group textarea {
  padding: 9px 12px; border: 2px solid var(--border); border-radius: 10px;
  font-size: 13px; font-family: inherit; outline: none; background: #faf8f5;
}
.form-group input:focus, .form-group select:focus, .form-group textarea:focus { border-color: var(--peach); background: #fff; }

.form-row { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }

.btn-submit {
  background: var(--peach); color: #fff; border: none; border-radius: 12px;
  padding: 12px; font-size: 14px; font-weight: 900; cursor: pointer; width: 100%;
  box-shadow: 0 4px 12px rgba(255, 116, 82, 0.3); margin-top: 8px;
}
.btn-submit:hover { background: #e05d3d; }
</style>
</head>
<body>

<div class="container">
  <!-- HEADER HERO -->
  <div class="hero">
    <div>
      <div class="hero-title">
        <span>STAFF PORTAL</span>
        🌿 セミナー総合案内ポータル
      </div>
    </div>
    <div class="hero-actions">
      <div class="stat-pills">
        <div class="pill-card"><div class="num" id="st-act">0</div><div class="lbl">案内中</div></div>
        <div class="pill-card"><div class="num" id="st-tot">0</div><div class="lbl">全件</div></div>
      </div>
      <button class="btn-add-seminar" onclick="openAddSeminarModal()">
        <span>＋</span> 新規セミナー登録
      </button>
    </div>
  </div>

  <!-- CONTROL PANEL -->
  <div class="control-panel">
    <input type="text" id="searchInput" class="search-input" placeholder="セミナー名・内容・案内対象でリアルタイム検索...">
    <div class="tab-group">
      <button class="tab-btn active" onclick="setFilter('all', this)">すべて</button>
      <button class="tab-btn" onclick="setFilter('案内中', this)">案内中</button>
      <button class="tab-btn" onclick="setFilter('準備中', this)">準備中</button>
    </div>
  </div>

  <!-- MAIN GRID -->
  <div class="grid" id="grid"></div>
</div>

<!-- モーダル1：詳細表示 -->
<div class="modal-bg" id="detailModal" onclick="if(event.target===this)closeModal('detailModal')">
  <div class="modal">
    <div class="modal-hdr">
      <h2 id="m-title">セミナー詳細</h2>
      <span class="modal-close" onclick="closeModal('detailModal')">✕</span>
    </div>
    <div id="m-body" style="font-size:13px;line-height:1.6;"></div>
    <div style="display:flex;justify-content:space-between;align-items:center;margin-top:10px;">
      <button class="btn-reserve" id="m-reserve-btn">📝 参加受付をする</button>
      <div id="m-url"></div>
    </div>
  </div>
</div>

<!-- モーダル2：参加受付（枠確保）フォーム -->
<div class="modal-bg" id="reserveModal" onclick="if(event.target===this)closeModal('reserveModal')">
  <div class="modal">
    <div class="modal-hdr">
      <h2>📝 参加受付・枠確保</h2>
      <span class="modal-close" onclick="closeModal('reserveModal')">✕</span>
    </div>
    <form class="form-grid" id="reserveForm" onsubmit="submitReserve(event)">
      <div class="form-group">
        <label>対象セミナー</label>
        <input type="text" id="res-seminar" readonly style="background:#f0eada;font-weight:bold;">
      </div>
      <div class="form-row">
        <div class="form-group">
          <label>区分</label>
          <select id="res-type">
            <option value="会員">会員番号あり</option>
            <option value="一般">一般（番号なし）</option>
          </select>
        </div>
        <div class="form-group">
          <label>会員番号（一般の場合は「一般」と入力）</label>
          <input type="text" id="res-member-id" placeholder="例: 10001" required>
        </div>
      </div>
      <div class="form-row">
        <div class="form-group">
          <label>苗字</label>
          <input type="text" id="res-last-name" placeholder="例: 山田" required>
        </div>
        <div class="form-group">
          <label>名前</label>
          <input type="text" id="res-first-name" placeholder="例: 太郎" required>
        </div>
      </div>
      <div class="form-row">
        <div class="form-group">
          <label>属性</label>
          <select id="res-relation">
            <option value="本人">本人</option>
            <option value="家族">家族</option>
            <option value="知り合い">知り合い</option>
          </select>
        </div>
        <div class="form-group">
          <label>ステータス</label>
          <select id="res-status">
            <option value="確定">確定</option>
            <option value="仮予約">仮予約</option>
          </select>
        </div>
      </div>
      <div class="form-group">
        <label>備考・連絡事項</label>
        <input type="text" id="res-note" placeholder="例: ◯◯様の紹介">
      </div>
      <button type="submit" class="btn-submit">枠を確保する 登録</button>
    </form>
  </div>
</div>

<!-- モーダル3：新規セミナー登録フォーム -->
<div class="modal-bg" id="addSeminarModal" onclick="if(event.target===this)closeModal('addSeminarModal')">
  <div class="modal">
    <div class="modal-hdr">
      <h2>✨ 新規セミナー登録</h2>
      <span class="modal-close" onclick="closeModal('addSeminarModal')">✕</span>
    </div>
    <form class="form-grid" id="addSeminarForm" onsubmit="submitNewSeminar(event)">
      <div class="form-group">
        <label>セミナー名</label>
        <input type="text" id="add-name" placeholder="例: Web集客基礎セミナー" required>
      </div>
      <div class="form-row">
        <div class="form-group">
          <label>開催日</label>
          <input type="text" id="add-date" placeholder="例: 2026/10/15" required>
        </div>
        <div class="form-group">
          <label>対象者</label>
          <select id="add-target">
            <option value="新規顧客">新規顧客</option>
            <option value="既存顧客">既存顧客</option>
            <option value="全顧客">全顧客</option>
          </select>
        </div>
      </div>
      <div class="form-row">
        <div class="form-group">
          <label>1次締め切り</label>
          <input type="text" id="add-dl1" placeholder="例: 2026/09/30">
        </div>
        <div class="form-group">
          <label>2次締め切り</label>
          <input type="text" id="add-dl2" placeholder="例: 2026/10/10">
        </div>
      </div>
      <div class="form-group">
        <label>セミナー内容（概要）</label>
        <textarea id="add-content" rows="3" placeholder="セミナーの概要やプログラム内容を入力..." required></textarea>
      </div>
      <div class="form-group">
        <label>求める参加者像（提案のポイント）</label>
        <textarea id="add-ideal" rows="2" placeholder="どんなお悩みを持っているお客様に案内すべきか..." required></textarea>
      </div>
      <div class="form-row">
        <div class="form-group">
          <label>ステータス</label>
          <select id="add-status">
            <option value="案内中">案内中</option>
            <option value="準備中">準備中</option>
            <option value="企画中">企画中</option>
            <option value="非表示">非表示（画面に出さない）</option>
          </select>
        </div>
        <div class="form-group">
          <label>詳細・案内URL（任意）</label>
          <input type="url" id="add-url" placeholder="https://example.com">
        </div>
      </div>
      <button type="submit" class="btn-submit">セミナーを追加・公開する</button>
    </form>
  </div>
</div>

<script>
// 設定済みのGAS WebアプリURL
const GAS_API_URL = 'https://script.google.com/a/macros/pcdepot.jp/s/AKfycbwU2z2rmKXmFt91p5v_cN75mSa3sdkmu3ykdEcR8dNECQDlVZ-88ANVWsCJ4Uba_tZB/exec'; 

// 設定済みのスプレッドシートID
const SHEET_ID = '1fDeRHnIv-z2dii_ndOCWbep95iuwZDKyZGR7fhgIe9E';

function isPastDate(dateStr) {
  if (!dateStr || dateStr === '未定' || dateStr === '-') return false;
  const parsed = Date.parse(dateStr.replace(/年|月/g, '/').replace(/日/g, ''));
  if (isNaN(parsed)) return false;
  const today = new Date();
  today.setHours(0, 0, 0, 0);
  return parsed < today.getTime();
}

let seminars = [];
let filter = 'all';

function fetchSpreadsheetData() {
  const readEndpoint = `https://docs.google.com/spreadsheets/d/${SHEET_ID}/gviz/tq?tqx=out:json&_t=${Date.now()}`;
  
  fetch(readEndpoint)
    .then(res => res.text())
    .then(text => {
      const match = text.match(/google\.visualization\.Query\.setResponse\(([\s\S\w]+)\);/);
      if (match && match[1]) {
        const parsed = JSON.parse(match[1]);
        const rows = parsed.table.rows;
        const fetched = [];
        for (let i = 0; i < rows.length; i++) {
          const r = rows[i];
          if (!r.c || !r.c[0]) continue;
          fetched.push({
            name: r.c[0] ? r.c[0].v : '',
            date: r.c[1] ? r.c[1].v : '未定',
            dl1: r.c[2] ? r.c[2].v : '-',
            dl2: r.c[3] ? r.c[3].v : '-',
            target: r.c[4] ? r.c[4].v : '全顧客',
            content: r.c[5] ? r.c[5].v : '',
            ideal: r.c[6] ? r.c[6].v : '',
            status: r.c[7] ? r.c[7].v : '企画中',
            url: r.c[8] ? r.c[8].v : ''
          });
        }
        if (fetched.length > 0) {
          seminars = fetched;
          render();
        }
      }
    }).catch(err => {
      console.error('スプレッドシートの取得に失敗しました。共有設定をご確認ください。', err);
    });
}

function render() {
  const q = document.getElementById('searchInput').value.toLowerCase();
  const grid = document.getElementById('grid');
  grid.innerHTML = '';

  const filtered = seminars.filter(s => {
    if (s.status === '非表示' || s.status === '終了') return false;
    if (isPastDate(s.date)) return false;
    const matchF = filter === 'all' || s.status === filter;
    const matchQ = s.name.toLowerCase().includes(q) || s.content.toLowerCase().includes(q) || s.ideal.toLowerCase().includes(q);
    return matchF && matchQ;
  });

  const activeSeminars = seminars.filter(s => s.status !== '非表示' && s.status !== '終了' && !isPastDate(s.date));
  document.getElementById('st-tot').innerText = activeSeminars.length;
  document.getElementById('st-act').innerText = activeSeminars.filter(s => s.status === '案内中').length;

  if (filtered.length === 0) {
    grid.innerHTML = '<div style="grid-column:1/-1;text-align:center;padding:40px;color:var(--text-muted);font-weight:700">現在ご案内可能なセミナーはありません。</div>';
    return;
  }

  filtered.forEach((s, idx) => {
    let bClass = 'badge-plan';
    if(s.status === '案内中') bClass = 'badge-active';
    if(s.status === '準備中') bClass = 'badge-prep';

    const card = document.createElement('div');
    card.className = 'card';
    card.innerHTML = `
      <div class="card-hdr">
        <h3 class="card-title">${escapeHtml(s.name)}</h3>
        <span class="badge ${bClass}">${s.status}</span>
      </div>
      <div class="info-table">
        <div class="info-item"><span>📅 開催日</span><strong>${escapeHtml(s.date)}</strong></div>
        <div class="info-item"><span>👥 対象</span><strong>${escapeHtml(s.target)}</strong></div>
      </div>
      <div class="ideal-box">
        <strong>💡 こんな方へご案内！</strong>
        ${escapeHtml(s.ideal)}
      </div>
      <div class="card-ftr">
        <div class="btn-group-left">
          <button class="btn-sec" onclick="openDetailModal(${idx})">詳細 🔍</button>
          <button class="btn-reserve" onclick="openReserveModal('${escapeHtml(s.name)}')">受付 📝</button>
        </div>
        ${s.url ? `<a href="${s.url}" target="_blank" class="btn-primary">案内URL ↗</a>` : '<span style="font-size:11px;color:var(--text-muted)">準備中</span>'}
      </div>
    `;
    grid.appendChild(card);
  });
}

function setFilter(f, el) {
  filter = f;
  document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
  el.classList.add('active');
  render();
}

function openModal(id) { document.getElementById(id).classList.add('open'); }
function closeModal(id) { document.getElementById(id).classList.remove('open'); }

function openDetailModal(idx) {
  const s = seminars[idx];
  document.getElementById('m-title').innerText = s.name;
  document.getElementById('m-body').innerHTML = `
    <p><strong>📅 開催日時:</strong> ${s.date}</p>
    <p><strong>⏳ 締め切り:</strong> 1次 ${s.dl1} / 2次 ${s.dl2}</p>
    <p><strong>👥 対象者:</strong> ${s.target}</p>
    <div style="background:#faf8f5;padding:12px;border-radius:10px;margin:12px 0;border:1px solid var(--border)">
      <strong>【内容】</strong><br>${s.content}
    </div>
    <div style="background:#fff3e0;padding:12px;border-radius:10px;color:#5c3810;">
      <strong>【おすすめのご案内対象】</strong><br>${s.ideal}
    </div>
  `;
  document.getElementById('m-reserve-btn').onclick = () => {
    closeModal('detailModal');
    openReserveModal(s.name);
  };
  document.getElementById('m-url').innerHTML = s.url ? `<a href="${s.url}" target="_blank" class="btn-primary">案内ページを開く ↗</a>` : '';
  openModal('detailModal');
}

function openReserveModal(seminarName) {
  document.getElementById('res-seminar').value = seminarName;
  openModal('reserveModal');
}

function openAddSeminarModal() { openModal('addSeminarModal'); }

function submitReserve(e) {
  e.preventDefault();
  const payload = {
    action: 'reserve',
    seminar: document.getElementById('res-seminar').value,
    memberId: document.getElementById('res-member-id').value,
    lastName: document.getElementById('res-last-name').value,
    firstName: document.getElementById('res-first-name').value,
    relation: document.getElementById('res-relation').value,
    status: document.getElementById('res-status').value,
    note: document.getElementById('res-note').value
  };

  if(GAS_API_URL) {
    fetch(GAS_API_URL, { method: 'POST', body: JSON.stringify(payload), mode: 'no-cors' });
  }

  alert(`「${payload.seminar}」への受付枠を確保しました！`);
  document.getElementById('reserveForm').reset();
  closeModal('reserveModal');
}

function submitNewSeminar(e) {
  e.preventDefault();
  const newSeminar = {
    action: 'addSeminar',
    name: document.getElementById('add-name').value,
    date: document.getElementById('add-date').value,
    dl1: document.getElementById('add-dl1').value || '-',
    dl2: document.getElementById('add-dl2').value || '-',
    target: document.getElementById('add-target').value,
    content: document.getElementById('add-content').value,
    ideal: document.getElementById('add-ideal').value,
    status: document.getElementById('add-status').value,
    url: document.getElementById('add-url').value || ''
  };

  seminars.unshift(newSeminar);
  render();

  if(GAS_API_URL) {
    fetch(GAS_API_URL, { method: 'POST', body: JSON.stringify(newSeminar), mode: 'no-cors' });
  }

  alert('新しいセミナーを登録・公開しました！');
  document.getElementById('addSeminarForm').reset();
  closeModal('addSeminarModal');
}

function escapeHtml(str) {
  if(!str) return '';
  return String(str).replace(/[&<>"']/g, m => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[m]));
}

document.getElementById('searchInput').addEventListener('input', render);

fetchSpreadsheetData();
</script>
